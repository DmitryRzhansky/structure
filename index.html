    function sideItem(view,name,iconName,count){return `<button type="button" class="nav-link ${state.view===view?'active':''}" data-view="${esc(view)}">${icon(iconName)}<span>${esc(name)}</span>${count===undefined?'':`<span class="nav-count">${count}</span>`}</button>`}
    function renderSidebar(){const c=[...CATS].sort((a,b)=>b.count-a.count);$('#sidebar-links').innerHTML=`<div class="side-nav">${sideItem('overview','Общая схема','grid-2x2')}${sideItem('tree','Дерево URL','network')}${sideItem('directory','Все страницы','list',466)}</div><div class="side-section">Направления обучения</div><div class="side-nav">${c.map(x=>sideItem('cat:'+x.key,x.name,x.icon,x.count)).join('')}</div><div class="side-section">Остальные страницы</div><div class="side-nav">${sideItem('other','Информационные и сервисные','files',9)}</div>`}
    function catCard(x){return `<button class="category-card" data-view="cat:${esc(x.key)}" aria-label="Открыть направление ${esc(x.name)}"><span class="card-top"><span class="card-symbol">${icon(x.icon)}</span><span class="card-count">${x.count?x.count+' программ': 'Без карточек'}</span></span><span class="card-name">${esc(x.name)}</span><span class="card-desc">${esc(x.description)}</span><span class="card-foot"><code class="path">${esc(x.new)}</code>${icon('arrow-right')}</span></button>`}
    function renderOverview(){let pop=[...CATS].sort((a,b)=>b.count-a.count);return `<section class="hero"><div class="hero-left"><h1>Структура сайта<br>учебного центра «Факультет»</h1><p>Все страницы на одной схеме: от главной и 11 направлений обучения до 446 отдельных программ, документов и сервисных разделов. Для каждого URL показан путь на старом сайте и предусмотренный адрес в новой структуре.</p></div><div class="hero-visual" aria-hidden="true"><svg class="diagram-line" viewBox="0 0 340 220"><path d="M105 106h60V40h70M165 106h70v83" stroke="#a8d2e6" stroke-width="2" stroke-dasharray="4 7" fill="none"/><path d="M165 106v84h-60" stroke="#a8d2e6" stroke-width="2" stroke-dasharray="4 7" fill="none"/><circle cx="165" cy="106" r="9" fill="#fdb863"/></svg><div class="floating-node fn1">${icon('house')} Главная</div><div class="floating-node fn2">${icon('folder-open')} Каталог <span class="hero-mini">11 направлений</span></div><div class="floating-node fn3">${icon('book-open')} Курсы <span class="hero-mini">446 страниц</span></div><div class="floating-node fn4">${icon('files')} Документы</div></div></section><section class="section"><div class="section-head"><div><h2>Как устроена навигация</h2><p>Понятная иерархия с отдельным входом в каталог и сохранением других разделов.</p></div><button class="btn btn-outline" data-view="tree">Открыть полную схему ${icon('arrow-right')}</button></div><div class="overview-split"><div class="panel"><h2 class="panel-title">Путь к программе</h2><p class="panel-note">Пользователь проходит от общего каталога к нужной специализации, затем к конкретному курсу.</p><div class="flow-rail"><div class="flow-box"><em>Шаг 01</em><strong>Главная</strong><code>/</code></div><span class="flow-arrow">${icon('arrow-right')}</span><div class="flow-box"><em>Шаг 02</em><strong>Каталог</strong><code>/kursy/</code></div><span class="flow-arrow">${icon('arrow-right')}</span><div class="flow-box"><em>Шаг 03</em><strong>Направление</strong><code>/kursy/{разде     function otherRow(x){return `<div class="other-item">${icon(x.ic)}<span>${esc(x.n)}</span><button data-detail="${x.i}" aria-label="Подробности ${esc(x.n)}" title="Посмотреть URL">${icon('arrow-right')}</button></div>`}
    function drawDonut(){if(!window.d3){return}const host=$('#donut');if(!host)return;host.innerHTML='';const d3=window.d3,size=238,r=size/2;const svg=d3.select(host).append('svg').attr('viewBox',`0 0 ${size} ${size}`).attr('role','img').attr('aria-label','Количество курсов по направлениям');const g=svg.append('g').attr('transform',`translate(${r},${r})`);const pie=d3.pie().sort(null).value(d=>d.count)(CATS.filter(x=>x.count>0));const arc=d3.arc().innerRadius(72).outerRadius(102).cornerRadius(4).padAngle(.025);g.selectAll('path').data(pie).join('path').attr('d',arc).attr('fill',d=>PALETTE[CATS.indexOf(d.data)]).attr('stroke','#fff').attr('stroke-width',2).style('cursor','pointer').on('click',(ev,d)=>navigate('cat:'+d.data.key)).append('title').text(d=>d.data.name+': '+d.data.count);g.append('text').attr('text-anchor','middle').attr('y','-3').attr('font-family','Montserrat,Arial').attr('font-size',30).attr('font-weight','800').attr('fill','#17344c').text('446');g.append('text').attr('text-anchor','middle').attr('y','22').attr('font-family','Manrope,Arial').attr('font-size',10).attr('font-weight','800').attr('fill','#8296a5').text('ПРОГРАММ')}
    function categoryView(key){const c=CAT_BY_KEY[key];if(!c)return renderOverview();const courses=PAGES.filter(x=>x.c===key&&x.t==='course');const matches=filterItems(courses);const note=c.count?`Карточки программ в направлении (${c.count} в инвентаре).`:'В исходном перечне нет отдельных карточек программ этого направления.';return `<div class="view-intro"><div><span class="pill">${icon('folder-open')} Раздел каталога</span></div><button class="btn btn-outline" data-view="overview">${icon('arrow-right')} Все направления</button></div><section class="category-hero"><span class="card-symbol">${icon(c.icon)}</span><div><h1>${esc(c.name)}</h1><p>${esc(c.description)}</p></div><span class="pill">${c.count} программ</span></section><div class="cat-route"><div class="route-box old"><div class="route-label">Текущий адрес на Tilda <button data-copy="${esc(fullUrl(c.old))}" title="Скопировать старый URL">${icon('copy')}</button></div><code>${esc(c.old)}</code></div><div class="route-box"><div class="route-label">Адрес раздела в новой структуре <button data-copy="${esc(fullUrl(c.new))}" title="Скопировать новый URL">${icon('copy')}</button></div><code>${esc(c.new)}</code></div></div><div class="section-head"><div><h2>Программы раздела</h2><p>${esc(note)} Для просмотра деталей нажмите на название.</p></div><button class="btn btn-outline" data-view="tree">${icon('network')} Дерево URL</button></div>${listing(matches,'course',c.count)}`}
    function filterItems(items){const q=state.query.toLocaleLowerCase('ru').trim();return !q?items:items.filter(x=>(x.n+' '+x.h+' '+x.seo+' '+x.o+' '+x.p+' '+x.g).toLocaleLowerCase('ru').includes(q))}
    function directoryView(onlyOther=false){let items=onlyOther?OTHERS:PAGES;let title=onlyOther?'Остальные страницы':'Все страницы сайта';let intro=onlyOther?'9 страниц вне каталога: главная, условия, новости, юридические документы и вход в личный кабинет.':'466 исходных URL с точными соответствиями адресов каталога и сохранением прочих страниц.';if(!onlyOther&&state.filter!=='all')items=items.filter(x=>x.t===state.filter);items=filterItems(items);return `<div class="view-intro"><div><h1>${title}</h1><p>${intro} Выберите строку, чтобы увидеть полный старый и новый адрес.</p></div><span class="pill">${icon('database')} ${items.length} ${items.length===1?'страница':'страниц'}</span></div>${onlyOther?'':`<div class="filters">${[['all','Все 466'],['category','Разделы — 11'],['course','Курсы — 446'],['other','Прочие — 9']].map(x=>`<button class="filter ${state.filter===x[0]?'on':''}" data-filter="${x[0]}">${x[1]}</button>`).join('')}</div>`}${listing(items,onlyOther?'other':state.filter,PAGES.length)}`}
    function rowHTML(x){const isOther=x.t==='other';return `<div class="data-row"><div class="row-primary"><span class="type-symbol">${icon(x.ic)}</span><div class="row-main"><button class="row-name" style="border:0;background:none;text-align:left;padding:0;cursor:pointer" data-detail="${x.i}">${esc(x.n)}</button><div class="row-sub">${esc(x.t==='course'?CAT_BY_KEY[x.c].name:(isOther?x.g:'Раздел каталога'))} · № ${x.i}</div></div></div><div class="row-url" title="Исходный URL">${esc(x.o)}</div><div class="row-url new" title="Целевой URL">${esc(x.p)}</div><div class="actions"><button class="icon-btn" title="Подробности" aria-label="Подробности" data-detail="${x.i}">${icon('info')}</button><button class="icon-btn" title="Скопировать новый URL" aria-label="Скопировать новый URL" data-copy="${esc(fullUrl(x.p))}">${icon('copy')}</button><a class="icon-btn" href="${esc(fullUrl(x.o))}" target="_blank" rel="noopener noreferrer" title="Открыть текущую страницу" aria-label="Открыть текущую страницу">${icon('external-link')}</a></div></div>`}
    function listing(items,kind,initial){const shown=items.slice(0,state.shown);return `<div class="list-panel"><div class="table-caption"><span><strong>Найдено: ${items.length}</strong> · Показано: ${shown.length}</span><span>Текущая → новая URL-структура</span></div><div class="list-head"><span>Страница</span><span>Текущий URL</span><span>Новый URL / сохраняемый адрес</span><span style="text-align:right">Действия</span></div>${shown.map(rowHTML).join('')}${!items.length?`<div class="empty">${icon('search')}<strong>Ничего не найдено</strong>Попробуйте другое название курса или часть URL.</div>`:''}${shown.length<items.length?`<div class="pagination-row"><button class="btn btn-outline" data-action="more">Показать еще ${Math.min(40,items.length-shown.length)} ${icon('chevron-down')}</button><span>из ${items.length}</span></div>`:''}</div>`}
    function treeView(){let courseCount=0;const cats=[...CATS].sort((a,b)=>b.count-a.count),q=state.query.trim().toLocaleLowerCase('ru');let visibleCats=cats.map(c=>({...c,items:filterItems(PAGES.filter(x=>x.t==='course'&&x.c===c.key))})).filter(c=>!q||c.items.length||c.name.toLowerCase().includes(q)||c.new.includes(q));return `<div class="view-intro"><div><h1>Дерево URL-структуры</h1><p>Иерархия нового сайта: главная → каталог → направление → программа. Раскройте ветку любого направления, чтобы увидеть все вложенные курсы и их адреса.</p></div><span class="pill">${icon('network')} 3 уровня каталога</span></div><div class="tree-explain"><div class="explain-card">${icon('house')}<strong>Главная страница</strong><p>Точка входа на сайт. От нее доступны каталог и остальные информационные разделы.</p></div><div class="explain-card">${icon('folder-open')}<strong>Направления обучения</strong><p>11 тематических разделов. Внутри — страницы всех соответствующих программ.</p></div><div class="explain-card">${icon('files')}<strong>Дополнительные разделы</strong><p>Новости, оплата, юридические сведения, личный кабинет и акции.</p></div></div><div class="tree-root"><div class="tree-node primary">${icon('house')}<strong>Главная · Учебный центр «Факультет»</strong><span class="tree-path">/</span></div><div class="tree-branch"><div class="tree-node">${icon('folder-open')}<strong>Каталог образовательных программ</strong><span class="special-chip">Новая страница</span><span class="tree-path">/kursy/</span></div><div class="tree-branch">${visibleCats.map(c=>`<details class="tree-group" ${q?'open':''}><summary>${icon(c.icon)}<strong>${esc(c.name)}</strong><span class="tree-count">${c.count} ${c.count===1?'курс':'курсов'}</span>${icon('chevron-right')}</summary><div class="tree-children"><div class="tree-leaf"><span class="tree-leaf-name"><button data-detail="${PAGES.find(x=>x.t==='category'&&x.c===c.key).i}" style="border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit">Страница направления</button></span><code>${esc(c.new)}</code><button class="icon-btn" data-copy="${esc(fullUrl(c.new))}" aria-label="Копировать URL">${icon('copy')}</button></div>${c.items.map(x=>`<div class="tree-leaf"><button class="tree-leaf-name" data-detail="${x.i}" style="border:0;background:none;text-align:left;padding:0;cursor:pointer">${esc(x.n)}</button><code>${esc(x.p)}</code><button class="icon-btn" data-copy="${esc(fullUrl(x.p))}" aria-label="Копировать URL">${icon('copy')}</button></div>`).join('')}${!c.count?`<div class="tree-leaf"><span class="tree-meta">В инвентаре нет отдельных карточек программ</span></div>`:''}</div></details>`).join('')}</div><details class="tree-group" open><summary>${icon('files')}<strong>Страницы вне каталога</strong><span class="tree-count">9 URL</span>${icon('chevron-right')}</summary><div class="tree-children compact-other">${GROUPS.map(gr=>`<div class="page-label" style="margin:15px 0 6px">${esc(gr.name)}</div>${OTHERS.filter(x=>x.g===gr.name).filter(x=>!q||filterItems([x]).length).map(x=>`<div class="tree-leaf"><button class="tree-leaf-name" data-detail="${x.i}" style="border:0;background:none;padding:0;text-align:left;cursor:pointer">${esc(x.n)}</button><code>${esc(x.p)}</code><button class="icon-btn" data-copy="${esc(fullUrl(x.p))}" aria-label="Копировать URL">${icon('copy')}</button></div>`).join('')}`).join('')}</div></details></div></div>`}
    function crumbName(){if(state.view.startsWith('cat:'))return CAT_BY_KEY[state.view.slice(4)]?.name||'Направление';return {overview:'Обзор',directory:'Все страницы',tree:'Дерево URL',other:'Вне каталога'}[state.view]||'Обзор'}

    function toast(s){let e=$('#toast');e.textContent=s;e.classList.add('on');clearTimeout(window.__toastHandle);window.__toastHandle=setTimeout(()=>e.classList.remove('on'),2500)}
    async function copyText(str){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(str)}else{const area=document.createElement('textarea');area.value=str;area.style.cssText='position:fixed;opacity:0;left:-9999px';document.body.appendChild(area);area.select();if(!document.execCommand('copy'))throw Error('copy');area.remove()}toast('Ссылка скопирована')}catch(e){toast('Не удалось скопировать. Выделите адрес вручную.')}}
    function openDetail(i){const x=BY_ID.get(Number(i));if(!x)return;const c=x.c?CAT_BY_KEY[x.c]:null;const old=fullUrl(x.o),target=fullUrl(x.p),type=x.t==='other'?'Страница вне каталога':LABELS[x.t];$('#modal-content').innerHTML=`<div class="modal-head"><div><div class="modal-type">${esc(type)} · Страница №${x.i}</div><h2 id="detail-title">${esc(x.n)}</h2></div><button class="modal-close" data-action="close" title="Закрыть">${icon('x')}</button></div>${c?`<span class="pill">${icon(c.icon)} ${esc(c.name)}</span>`:''}<div class="modal-route"><div class="route-label">Текущий URL (Tilda)</div><code>${esc(old)}</code><button data-copy="${esc(old)}" title="Скопировать">${icon('copy')}</button></div><div class="modal-route"><div class="route-label">${x.t==='other'?'Сохраняемый URL':'Новый URL (Flask)'}</div><code>${esc(target)}</code><button data-copy="${esc(target)}" title="Скопировать">${icon('copy')}</button></div>${x.seo?`<div class="modal-seo"><strong>Title в исходном инвентаре:</strong><div>${esc(x.seo)}</div></div>`:''}<div class="modal-footer"><a class="btn btn-primary" href="${esc(old)}" target="_blank" rel="noopener noreferrer">${icon('external-link')} Открыть текущую страницу</a><button class="btn btn-outline" data-copy="${esc(target)}">${icon('copy')} Скопировать новый адрес</button></div>`;$('#details-modal').classList.add('open');iconize();$('#details-modal').querySelector('.modal-close')?.focus()}
    document.addEventListener('click',e=>{const target=e.target.closest('[data-view],[data-detail],[data-copy],[data-filter],[data-action]');if(!target)return;if(target.dataset.view){navigate(target.dataset.view);return}if(target.dataset.detail){openDetail(target.dataset.detail);return}if(target.dataset.copy){copyText(target.dataset.copy);return}if(target.dataset.filter){state.filter=target.dataset.filter;state.shown=40;render();return}let act=target.dataset.action;if(act==='more'){state.shown+=40;render()}else if(act==='menu')$('#sidebar').classList.toggle('mobile-open');else if(act==='close')$('#details-modal').classList.remove('open')});
    $('#details-modal').addEventListener('click',e=>{if(e.target===$('#details-modal'))$('#details-modal').classList.remove('open')});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#details-modal').classList.remove('open');$('#sidebar').classList.remove('mobile-open')}});
    render();
    window.addEventListener('load',()=>{if(state.view==='overview')drawDonut();if(window.lucide)iconize()},{once:true});
  </script>
</body>
</html>
